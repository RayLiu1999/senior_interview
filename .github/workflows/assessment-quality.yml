name: Assessment Quality

on:
  push:
  pull_request:

jobs:
  validate-assessments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Validate concept and assessment mappings
        run: go run ./scripts/validate_assessments.go
