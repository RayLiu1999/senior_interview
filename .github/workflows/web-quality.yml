name: Web Quality

on:
  push:
  pull_request:

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'

      - name: Validate content governance
        run: go run ./scripts/validate_assessments.go

      - name: Install pnpm for dependency cache
        run: npm install --global --no-audit --no-fund pnpm@10.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Prepare Nuxt test environment
        working-directory: web
        run: pnpm exec nuxt prepare

      - name: Generate content manifest
        working-directory: web
        run: pnpm content:generate

      - name: Run web tests
        working-directory: web
        run: pnpm test

      - name: Typecheck web app
        working-directory: web
        run: pnpm typecheck

      - name: Build web app
        working-directory: web
        run: pnpm build

      - name: Install Chromium for browser smoke tests
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: web
        env:
          PLAYWRIGHT_SERVER_COMMAND: node .output/server/index.mjs
        run: pnpm e2e
